{% extends "base.html" %}

{% block title %}Tambah Pelanggan - CRUD Item{% endblock %}

{% block content %}
<h2>Tambah Pelanggan Baru</h2>

<form method="POST" action="{{ url_for('create_pelanggan') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="nama">Nama Pelanggan</label>
        <input type="text" id="nama" name="nama" value="{{ nama if nama else '' }}" required placeholder="Masukkan nama pelanggan">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email if email else '' }}" placeholder="Masukkan email (opsional)">
    </div>

    <div class="form-group">
        <label for="telepon">Telepon</label>
        <input type="text" id="telepon" name="telepon" value="{{ telepon if telepon else '' }}" placeholder="Masukkan nomor telepon (opsional)">
    </div>

    <div class="form-group">
        <label for="alamat">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat (opsional)">{{ alamat if alamat else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a href="{{ url_for('pelanggan_index') }}" class="btn btn-secondary">Batal</a>
    </div>
</form>
{% endblock %}
