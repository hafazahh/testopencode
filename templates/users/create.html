{% extends "base.html" %}

{% block title %}Tambah User - CRUD Item{% endblock %}

{% block content %}
<h2>Tambah User</h2>
<form method="POST" action="{{ url_for('create_user') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>
    <div class="form-group">
        <label for="role_id">Role</label>
        <select id="role_id" name="role_id" required>
            <option value="">-- Pilih Role --</option>
            {% for role in roles %}
            <option value="{{ role.id }}" {% if role_id == role.id %}selected{% endif %}>{{ role.nama }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Simpan</button>
    <a href="{{ url_for('users_index') }}" class="btn">Batal</a>
</form>
{% endblock %}
