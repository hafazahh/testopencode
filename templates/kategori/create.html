{% extends "base.html" %}

{% block title %}Tambah Kategori - CRUD Item{% endblock %}

{% block content %}
<h2>Tambah Kategori Baru</h2>

<form method="POST" action="{{ url_for('create_kategori') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="nama">Nama Kategori</label>
        <input type="text" id="nama" name="nama" value="{{ nama if nama else '' }}" required placeholder="Masukkan nama kategori">
    </div>

    <div class="form-group">
        <label for="deskripsi">Deskripsi</label>
        <textarea id="deskripsi" name="deskripsi" rows="3" placeholder="Masukkan deskripsi (opsional)">{{ deskripsi if deskripsi else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Simpan</button>
        <a href="{{ url_for('kategori_index') }}" class="btn btn-secondary">Batal</a>
    </div>
</form>
{% endblock %}
